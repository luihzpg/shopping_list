name: Supabase Keepalive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check schedule window
        id: cadence
        shell: bash
        run: |
          epoch_days=$(( $(date -u +%s) / 86400 ))
          if (( epoch_days % 3 == 0 )); then
            echo "run_keepalive=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_keepalive=false" >> "$GITHUB_OUTPUT"
            echo "Skipping keepalive today to maintain a 3-day cadence."
          fi

      - name: Validate secrets
        if: steps.cadence.outputs.run_keepalive == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is not set"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is not set"; exit 1; }

      - name: Insert keepalive row
        if: steps.cadence.outputs.run_keepalive == 'true' || github.event_name == 'workflow_dispatch'
        id: insert
        shell: bash
        run: |
          item_name="__keepalive__gha__${GITHUB_RUN_ID}_$(date -u +%s)"
          echo "item_name=$item_name" >> "$GITHUB_OUTPUT"

          payload=$(printf '[{"name":"%s"}]' "$item_name")

          curl --fail --silent --show-error \
            --request POST \
            --url "${SUPABASE_URL}/rest/v1/shopping_items" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "$payload"

      - name: Delete keepalive row
        if: steps.cadence.outputs.run_keepalive == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request DELETE \
            --url "${SUPABASE_URL}/rest/v1/shopping_items?name=eq.${{ steps.insert.outputs.item_name }}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}"
